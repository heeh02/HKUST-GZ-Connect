name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pinned Rust toolchain
        working-directory: independent
        run: rustup show active-toolchain

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          package_version="$(node -p "require('./desktop/package.json').version")"
          test "v${package_version}" = "$GITHUB_REF_NAME"

      - name: Install deps
        working-directory: desktop
        run: npm ci

      - name: Test desktop shell
        working-directory: desktop
        shell: bash
        run: |
          npm test
          npm run check:architecture
          npm run check:secrets
          npm audit --audit-level=high
          while IFS= read -r source_file; do
            node --check "$source_file"
          done < <(rg --files -g '*.js' -g '!node_modules/**' -g '!release/**')
          bash -n ../hkustgzconnect
          bash -n ../tools/mac-cli/proxy-credential.sh

      - name: Test independent Rust engine
        working-directory: independent
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          node ../desktop/e2e/auth-control-fixture.js

      - name: Run release performance disaster guards
        if: matrix.platform == 'mac'
        working-directory: independent
        run: |
          cargo test --locked --release --lib offline_socks5_frontend_matrix -- \
            --ignored --nocapture --test-threads=1
          cargo test --locked --release --test poll_latency_probe \
            offline_netstack_poll_latency_matrix -- \
            --ignored --nocapture --test-threads=1

      - name: Exercise real Electron integration and browser soak
        if: matrix.platform == 'mac'
        working-directory: desktop
        run: |
          npm run test:main-integration
          ./node_modules/.bin/electron e2e/campus-browser-toolbar.electron.js
          npm run test:campus-mfa-safety
          npm run test:campus-popup-mfa-safety
          npm run test:strict-proxy-auth
          npm run test:renderer-layout
          npm run test:browser-performance
          npm run test:routing-restart
          npm run test:idle-performance

      - name: Build independent engines (mac)
        if: matrix.platform == 'mac'
        working-directory: independent
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --locked --release --bin ec-engine --target aarch64-apple-darwin
          cargo build --locked --release --bin ec-engine --target x86_64-apple-darwin
          cargo build --locked --release --bin ec-proxy-command --target aarch64-apple-darwin
          cargo build --locked --release --bin ec-proxy-command --target x86_64-apple-darwin
          mkdir -p ../desktop/engine
          cp target/aarch64-apple-darwin/release/ec-engine \
            ../desktop/engine/ec-engine-darwin-arm64
          cp target/x86_64-apple-darwin/release/ec-engine \
            ../desktop/engine/ec-engine-darwin-amd64
          cp target/aarch64-apple-darwin/release/ec-proxy-command \
            ../desktop/engine/ec-proxy-command-darwin-arm64
          cp target/x86_64-apple-darwin/release/ec-proxy-command \
            ../desktop/engine/ec-proxy-command-darwin-amd64
          cp config/hkustgz.json ../desktop/engine/hkustgz.json

      - name: Build independent engine (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        working-directory: independent
        run: |
          cargo build --locked --release --bin ec-engine --bin ec-proxy-command
          New-Item -ItemType Directory -Force -Path ../desktop/engine | Out-Null
          Copy-Item target/release/ec-engine.exe ../desktop/engine/ec-engine-windows-amd64.exe
          Copy-Item target/release/ec-proxy-command.exe ../desktop/engine/ec-proxy-command-windows-amd64.exe
          Copy-Item config/hkustgz.json ../desktop/engine/hkustgz.json

      - name: Build independent engines (Linux x86_64)
        if: matrix.platform == 'linux'
        working-directory: independent
        run: |
          cargo build --locked --release --bin ec-engine --bin ec-proxy-command
          mkdir -p ../desktop/engine
          cp target/release/ec-engine ../desktop/engine/ec-engine-linux-amd64
          cp target/release/ec-proxy-command ../desktop/engine/ec-proxy-command-linux-amd64
          cp config/hkustgz.json ../desktop/engine/hkustgz.json

      # Only export CSC_LINK when a cert secret actually exists — an EMPTY CSC_LINK
      # makes electron-builder try (and fail) to read "" as a cert file.
      - name: Configure macOS signing
        if: matrix.platform == 'mac'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          AID: ${{ secrets.APPLE_ID }}
          APW: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          ATID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MAC_CSC_LINK" ]; then
            { echo "CSC_LINK=$MAC_CSC_LINK"; echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD";
              echo "CSC_IDENTITY_AUTO_DISCOVERY=true";
              echo "APPLE_ID=$AID"; echo "APPLE_APP_SPECIFIC_PASSWORD=$APW"; echo "APPLE_TEAM_ID=$ATID"; } >> "$GITHUB_ENV"
            echo "macOS: Developer ID signing + notarization"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "macOS: ad-hoc signing (no cert) — opens via right-click → Open"
          fi

      - name: Build (macOS DMG)
        if: matrix.platform == 'mac'
        working-directory: desktop
        run: |
          sudo mdutil -a -i off >/dev/null 2>&1 || true   # fewer hdiutil "busy" flakes
          built=0
          for i in 1 2 3; do
            if npx electron-builder --mac dmg --arm64 --x64; then
              built=1
              break
            fi
            echo "DMG attempt $i failed, retrying"
            sleep 8
          done
          if [ "$built" != "1" ]; then
            echo "no macOS DMG was produced"
            exit 1
          fi
          test -n "$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)" || {
            echo "no macOS DMG was produced"
            exit 1
          }
          test "$(lipo -archs release/mac-arm64/hkustgzconnect.app/Contents/Resources/engine/ec-engine-darwin-arm64)" = "arm64"
          test "$(lipo -archs release/mac/hkustgzconnect.app/Contents/Resources/engine/ec-engine-darwin-amd64)" = "x86_64"
          test "$(lipo -archs release/mac-arm64/hkustgzconnect.app/Contents/Resources/engine/ec-proxy-command-darwin-arm64)" = "arm64"
          test "$(lipo -archs release/mac/hkustgzconnect.app/Contents/Resources/engine/ec-proxy-command-darwin-amd64)" = "x86_64"

      - name: Verify packaged macOS applications
        if: matrix.platform == 'mac'
        working-directory: desktop
        run: |
          node build/verify-package.js \
            release/mac-arm64/hkustgzconnect.app/Contents/Resources darwin arm64
          node build/verify-package.js \
            release/mac/hkustgzconnect.app/Contents/Resources darwin x64

      - name: Configure Windows signing
        if: matrix.platform == 'win'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$WIN_CSC_LINK" ]; then
            { echo "CSC_LINK=$WIN_CSC_LINK"; echo "CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD"; } >> "$GITHUB_ENV"
          fi

      - name: Build (Windows exe)
        if: matrix.platform == 'win'
        working-directory: desktop
        run: npm run dist:win

      - name: Verify packaged Windows application
        if: matrix.platform == 'win'
        working-directory: desktop
        run: node build/verify-package.js release/win-unpacked/resources win32 x64

      - name: Build (Linux AppImage x86_64)
        if: matrix.platform == 'linux'
        working-directory: desktop
        run: |
          npm run dist:linux
          test -n "$(find release -maxdepth 1 -type f -name '*.AppImage' -print -quit)" || {
            echo "no Linux AppImage was produced"
            exit 1
          }

      - name: Verify packaged Linux application
        if: matrix.platform == 'linux'
        working-directory: desktop
        run: node build/verify-package.js release/linux-unpacked/resources linux x64

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hkustgzconnect-${{ matrix.platform }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
            desktop/release/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The build matrix never receives a write-capable token. Only this small
      # publish job can modify a release, and every action is commit-pinned.
      - name: Download verified build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: hkustgzconnect-*
          path: artifacts
          merge-multiple: true
      - name: Attach DMG, EXE, and AppImage assets to the tagged release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            artifacts/*.dmg
            artifacts/*.exe
            artifacts/*.AppImage
