name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        working-directory: independent
        run: rustup show active-toolchain

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          package_version="$(node -p "require('./desktop/package.json').version")"
          test "v${package_version}" = "$GITHUB_REF_NAME"

      - name: Install deps
        working-directory: desktop
        run: npm ci

      - name: Test desktop shell
        working-directory: desktop
        run: |
          npm test
          npm audit --audit-level=high
          node --check main.js
          node --check preload.js
          node --check campus-preload.js
          node --check lib/campus-browser.js
          node --check renderer/campus-browser.js
          node --check renderer/app.js

      - name: Test independent Rust engine
        working-directory: independent
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Build independent engines (mac)
        if: matrix.platform == 'mac'
        working-directory: independent
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --locked --release --bin ec-engine --target aarch64-apple-darwin
          cargo build --locked --release --bin ec-engine --target x86_64-apple-darwin
          mkdir -p ../desktop/engine
          cp target/aarch64-apple-darwin/release/ec-engine \
            ../desktop/engine/ec-engine-darwin-arm64
          cp target/x86_64-apple-darwin/release/ec-engine \
            ../desktop/engine/ec-engine-darwin-amd64
          cp config/hkustgz.json ../desktop/engine/hkustgz.json

      - name: Build independent engine (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        working-directory: independent
        run: |
          cargo build --locked --release --bin ec-engine
          New-Item -ItemType Directory -Force -Path ../desktop/engine | Out-Null
          Copy-Item target/release/ec-engine.exe ../desktop/engine/ec-engine-windows-amd64.exe
          Copy-Item config/hkustgz.json ../desktop/engine/hkustgz.json

      # Only export CSC_LINK when a cert secret actually exists — an EMPTY CSC_LINK
      # makes electron-builder try (and fail) to read "" as a cert file.
      - name: Configure macOS signing
        if: matrix.platform == 'mac'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          AID: ${{ secrets.APPLE_ID }}
          APW: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          ATID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MAC_CSC_LINK" ]; then
            { echo "CSC_LINK=$MAC_CSC_LINK"; echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD";
              echo "CSC_IDENTITY_AUTO_DISCOVERY=true";
              echo "APPLE_ID=$AID"; echo "APPLE_APP_SPECIFIC_PASSWORD=$APW"; echo "APPLE_TEAM_ID=$ATID"; } >> "$GITHUB_ENV"
            echo "macOS: Developer ID signing + notarization"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "macOS: ad-hoc signing (no cert) — opens via right-click → Open"
          fi

      # zip (reliable, no hdiutil) is the guaranteed artifact; dmg is best-effort
      # because hdiutil detach flakes on CI runners — retried, never fails the build.
      - name: Build (macOS zip + dmg)
        if: matrix.platform == 'mac'
        working-directory: desktop
        run: |
          sudo mdutil -a -i off >/dev/null 2>&1 || true   # fewer hdiutil "busy" flakes
          npx electron-builder --mac zip --arm64 --x64
          for i in 1 2 3; do
            npx electron-builder --mac dmg --arm64 --x64 && break || { echo "dmg attempt $i failed, retrying"; sleep 8; }
          done
          test "$(lipo -archs release/mac-arm64/hkustgzconnect.app/Contents/Resources/engine/ec-engine-darwin-arm64)" = "arm64"
          test "$(lipo -archs release/mac/hkustgzconnect.app/Contents/Resources/engine/ec-engine-darwin-amd64)" = "x86_64"
          ls release/*.dmg >/dev/null 2>&1 && echo "dmg built" || echo "::warning::dmg unavailable (CI hdiutil flake); zip shipped"
          cd release
          : > SHA256SUMS-macos.txt
          for file in *.dmg *.zip; do
            [ -f "$file" ] && shasum -a 256 "$file" >> SHA256SUMS-macos.txt
          done
          test -s SHA256SUMS-macos.txt

      - name: Verify packaged macOS applications
        if: matrix.platform == 'mac'
        working-directory: desktop
        run: |
          node build/verify-package.js \
            release/mac-arm64/hkustgzconnect.app/Contents/Resources darwin arm64
          node build/verify-package.js \
            release/mac/hkustgzconnect.app/Contents/Resources darwin x64

      - name: Configure Windows signing
        if: matrix.platform == 'win'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$WIN_CSC_LINK" ]; then
            { echo "CSC_LINK=$WIN_CSC_LINK"; echo "CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD"; } >> "$GITHUB_ENV"
          fi

      - name: Build (Windows exe)
        if: matrix.platform == 'win'
        working-directory: desktop
        run: npm run dist:win

      - name: Verify packaged Windows application
        if: matrix.platform == 'win'
        working-directory: desktop
        run: node build/verify-package.js release/win-unpacked/resources win32 x64

      - name: Generate Windows checksums
        if: matrix.platform == 'win'
        shell: pwsh
        working-directory: desktop/release
        run: |
          $lines = Get-ChildItem -File *.exe | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          if (-not $lines) { throw "no Windows release artifact found" }
          $lines | Set-Content -Encoding ascii SHA256SUMS-windows.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hkustgzconnect-${{ matrix.platform }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/SHA256SUMS-*.txt
          if-no-files-found: warn

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/SHA256SUMS-*.txt
