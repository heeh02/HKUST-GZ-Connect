name: EasyConnect compatibility watch

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'

permissions:
  contents: read

concurrency:
  group: easyconnect-compatibility-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  offline-tests:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: independent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run offline compatibility tests
        run: cargo test --locked

  live-compatibility:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: offline-tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: independent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Build native observer
        run: cargo build --locked --release --bin ec-watch
      - name: Collect and compare sanitized metadata
        run: |
          target/release/ec-watch collect \
            --config config/hkustgz.json \
            --output snapshots/live/current.json \
            --compare baselines/hkustgz-production.json \
            --diff-output diffs/live/current.json \
            --fail-on-change
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: easyconnect-compatibility-evidence
          path: |
            independent/snapshots/live/current.json
            independent/diffs/live/current.json
          if-no-files-found: warn
          retention-days: 30
