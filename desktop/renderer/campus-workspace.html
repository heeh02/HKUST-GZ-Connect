<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>校园工作台</title>
  <link rel="stylesheet" href="design-tokens.css" />
  <link rel="stylesheet" href="campus-workspace.css" />
</head>
<body>
  <main class="workspace-shell">
    <header class="workspace-header surface">
      <div class="workspace-brand">
        <span class="workspace-kicker">EASYCONNECT · CAMPUS WORKSPACE</span>
        <h1 id="workspaceSchool">校园工作台</h1>
      </div>
      <div class="workspace-header-actions">
        <span id="workspaceTrust" class="trust-badge" hidden>未审核</span>
        <span class="route-ready"><span class="ready-dot"></span><span id="workspaceReady">自动选择网络</span></span>
        <div id="gatewayLinks" class="gateway-links"></div>
        <button id="manageRules" class="soft-button" type="button">网站规则</button>
      </div>
    </header>

    <nav id="workspaceNavigation" class="workspace-navigation surface" aria-label="校园工作台页面">
      <button type="button" data-workspace-screen="home" class="active">首页</button>
      <button type="button" data-workspace-screen="catalog">服务目录</button>
      <button type="button" data-workspace-screen="manage">整理收藏</button>
    </nav>

    <section class="workspace-command surface" aria-label="校园服务搜索">
      <div class="search-box">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
        <input id="workspaceSearch" type="search" maxlength="80"
               placeholder="搜索校园服务" />
        <button id="clearWorkspaceSearch" class="search-clear" type="button" hidden>清除</button>
        <kbd>⌘K</kbd>
      </div>
    </section>

    <section id="searchScreen" class="workspace-screen" hidden>
      <section class="module surface">
        <div class="module-heading"><div><span class="module-eyebrow">SEARCH</span><h2 id="searchTitle">搜索结果</h2></div></div>
        <div id="searchGrid" class="resource-grid"></div>
      </section>
    </section>

    <section id="homeScreen" class="workspace-screen">
      <section id="favoritesModule" class="module surface">
        <div class="module-heading">
          <div><span class="module-eyebrow">MY WORKSPACE</span><h2 id="favoritesTitle">我的收藏</h2></div>
          <button id="openManage" class="soft-button" type="button">整理收藏</button>
        </div>
        <div id="favoriteGroups" class="favorite-groups"></div>
      </section>

      <section id="recentModule" class="module surface">
        <div class="module-heading"><div><span class="module-eyebrow">RECENT</span><h2 id="recentTitle">最近使用</h2></div></div>
        <div id="recentGrid" class="resource-grid"></div>
      </section>

      <section id="starterModule" class="module surface" hidden>
        <div class="module-heading"><div><span class="module-eyebrow">START HERE</span><h2 id="starterTitle">常用入口</h2></div></div>
        <div id="starterGrid" class="resource-grid"></div>
      </section>
    </section>

    <section id="catalogScreen" class="workspace-screen" hidden>
      <section class="module surface">
        <div class="module-heading">
          <div><span class="module-eyebrow">CATALOG</span><h2 id="catalogTitle">按使用场景查找</h2></div>
          <button id="catalogBack" class="text-button" type="button" hidden>返回分类</button>
        </div>
        <div id="categoryOverview" class="category-overview"></div>
        <div id="categoryResults" class="resource-grid" hidden></div>
      </section>
    </section>

    <section id="manageScreen" class="workspace-screen" hidden>
      <section class="module surface">
        <div class="module-heading">
          <div><span class="module-eyebrow">ORGANIZE</span><h2 id="manageTitle">整理收藏</h2></div>
          <button id="createGroup" class="soft-button" type="button">＋ 新建分组</button>
        </div>
        <div class="manage-layout">
          <section class="manage-panel">
            <div class="group-heading"><h3 id="resourcePoolTitle">网站库</h3><span id="resourcePoolCount" class="group-count"></span></div>
            <div id="resourcePool" class="resource-grid"></div>
          </section>
          <section class="manage-panel">
            <div class="group-heading"><h3 id="manageGroupsTitle">我的分组</h3></div>
            <div id="manageGroups" class="favorite-groups manage-mode"></div>
          </section>
        </div>
      </section>
    </section>

    <section id="workspaceEmpty" class="empty-state surface" hidden>
      <strong id="emptyTitle">没有符合条件的校园服务</strong>
      <span id="emptyHint">尝试其他关键词。</span>
      <button id="clearWorkspaceFilter" class="soft-button" type="button">清除搜索</button>
    </section>
  </main>

  <dialog id="groupDialog" class="group-dialog">
    <form method="dialog">
      <h2 id="groupDialogTitle">新建分组</h2>
      <label id="groupNameLabel" for="groupName">分组名称</label>
      <input id="groupName" maxlength="40" autocomplete="off" />
      <p id="groupError" role="alert"></p>
      <div class="dialog-actions">
        <button id="cancelGroup" value="cancel" class="text-button">取消</button>
        <button id="saveGroup" value="default" class="primary-button">保存</button>
      </div>
    </form>
  </dialog>

  <script src="campus-workspace-model.js"></script>
  <script src="campus-workspace.js"></script>
</body>
</html>
