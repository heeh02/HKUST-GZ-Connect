<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>校园工作台</title>
  <link rel="stylesheet" href="design-tokens.css" />
  <link rel="stylesheet" href="campus-workspace.css" />
</head>
<body>
  <main class="workspace-shell">
    <section id="searchScreen" class="workspace-screen" hidden>
      <section class="workspace-panel surface">
        <div class="view-heading">
          <h1 id="searchTitle">搜索结果</h1>
          <div class="view-actions">
            <div id="searchPager" class="workspace-pager" aria-label="搜索结果页码"></div>
            <button id="clearWorkspaceSearch" class="soft-button" type="button">返回工作台</button>
          </div>
        </div>
        <div id="searchGrid" class="resource-grid"></div>
        <div id="workspaceEmpty" class="empty-state" hidden>
          <strong id="emptyTitle">没有符合条件的校园服务</strong>
          <span id="emptyHint">尝试其他关键词。</span>
          <button id="clearWorkspaceFilter" class="soft-button" type="button">返回工作台</button>
        </div>
      </section>
    </section>

    <section id="homeScreen" class="workspace-screen">
      <section id="servicePanel" class="workspace-panel surface">
        <div class="primary-navigation">
          <nav id="primaryTabs" class="primary-tabs" aria-label="校园工作台主视图">
            <button id="primaryWorkspace" type="button" data-primary-view="workspace">我的工作区</button>
            <button id="primaryRecent" type="button" data-primary-view="recent">最近使用</button>
            <button id="primaryCatalog" type="button" data-primary-view="catalog">网站库</button>
          </nav>
          <button id="openManage" class="soft-button" type="button">整理收藏</button>
        </div>
        <div id="secondaryNavigation" class="secondary-navigation">
          <select id="secondarySelect" class="secondary-select" aria-label="当前视图选项"></select>
          <div id="serviceViewTabs" class="secondary-tabs" role="tablist" aria-label="当前视图选项"></div>
          <button id="quickCreateGroup" class="secondary-create" type="button">＋ 新建分类</button>
        </div>
        <div class="view-heading">
          <h1><span id="serviceViewTitle">我的收藏</span><span id="serviceViewCount" class="view-count"></span></h1>
          <div id="servicePager" class="workspace-pager" aria-label="服务页码"></div>
        </div>
        <div id="serviceViewGrid" class="resource-grid service-view-grid"></div>
      </section>
    </section>

    <section id="manageScreen" class="workspace-screen" hidden>
      <section class="workspace-panel surface">
        <div class="view-heading manage-heading">
          <h1 id="manageTitle">整理收藏</h1>
          <div class="module-actions">
            <button id="backToServices" class="text-button" type="button">返回校园服务</button>
            <button id="createGroup" class="soft-button" type="button">＋ 新建分类</button>
          </div>
        </div>
        <div class="manage-layout">
          <aside id="manageSidebar" class="manage-sidebar" aria-label="我的分类">
            <div class="group-heading"><h3 id="manageGroupsTitle">我的分类</h3></div>
            <nav id="manageFolderNav" class="manage-folder-nav"></nav>
          </aside>
          <section class="manage-panel manage-content">
            <div class="group-heading">
              <h3 id="resourcePoolTitle">收藏</h3><span id="resourcePoolCount" class="group-count"></span>
              <div id="managePager" class="workspace-pager" aria-label="管理页码"></div>
            </div>
            <div id="bulkActions" class="bulk-actions">
              <label class="bulk-select-page"><input id="selectPageResources" type="checkbox" /><span id="selectPageLabel">选择本页</span></label>
              <span id="bulkSelectedCount" class="bulk-selected-count">已选择 0 项</span>
              <select id="bulkGroupSelect" aria-label="目标分类" hidden></select>
              <button id="bulkAddToGroup" class="soft-button" type="button" disabled hidden>加入分类</button>
              <button id="bulkClearSelection" class="text-button" type="button" disabled hidden>取消选择</button>
            </div>
            <div id="resourcePool" class="resource-grid"></div>
          </section>
        </div>
      </section>
    </section>

  </main>

  <dialog id="groupDialog" class="group-dialog">
    <form method="dialog">
      <h2 id="groupDialogTitle">新建分类</h2>
      <label id="groupNameLabel" for="groupName">分类名称</label>
      <input id="groupName" maxlength="40" autocomplete="off" />
      <p id="groupError" role="alert"></p>
      <div class="dialog-actions">
        <button id="cancelGroup" value="cancel" class="text-button">取消</button>
        <button id="saveGroup" value="default" class="primary-button">保存</button>
      </div>
    </form>
  </dialog>

  <script src="campus-workspace-model.js"></script>
  <script src="campus-workspace.js"></script>
</body>
</html>
